<h2 id="%E6%A0%B7%E6%9C%AC%E5%86%85%E7%9A%84%E9%AD%94%E6%9C%AF-vs-%E6%A0%B7%E6%9C%AC%E5%A4%96%E7%9A%84%E7%8E%B0%E5%AE%9E">样本内的“魔术” vs 样本外的现实</h2>
<h3 id="%E5%9B%9B%E5%8F%AA%E5%88%B8%E5%95%86%E6%9C%9F%E8%B4%A7%E5%A4%9A%E8%B5%84%E4%BA%A7%E6%8C%87%E6%95%B0%E5%A4%8D%E6%A0%B8">四只券商/期货多资产指数复核</h3>
<p>CI011800.WI · CICSF040.WI · CI011001.WI · GALLW.WI</p>
<p><small>数据：Wind；统一截止：2026-08-11</small></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2">
<h1 id="%E7%BB%93%E8%AE%BA%E5%85%88%E8%A1%8C%E6%96%87%E7%AB%A0%E7%9A%84%E9%97%AE%E9%A2%98%E6%84%8F%E8%AF%86%E6%98%AF%E5%AF%B9%E7%9A%84%E6%95%B0%E5%AD%97%E5%8F%A3%E5%BE%84%E4%B8%8D%E5%A4%9F%E7%BB%9F%E4%B8%80">结论先行：文章的问题意识是对的，数字口径不够统一</h1>
<ul>
<li><strong>样本内外必须拆</strong>：发布前曲线不是可交易业绩，发布后才真正经历公开检验。</li>
<li><strong>四只不能只按年化收益排名</strong>：价格/全收益口径、历史长度、透明度和产品可复制性均不同。</li>
<li><strong>公众号数字不能整段照抄</strong>：22个主张中，8项可复现、7项近似、7项与当前 Wind 点位明显不一致。</li>
<li><strong>真正的“明星”仍未被解释</strong>：CI011800 在 2025 年收益最高，但没有权重，无法证明由哪类资产或择时贡献。</li>
<li><strong>证据最强的是 CICSF040 的长期运行记录</strong>；但规则和权重不透明，仍是一个绩效优秀的黑箱指数。</li>
</ul>
<blockquote>
<p>本报告不否定文章的主题，而是把“过拟合怀疑”升级为可核验的证据链。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3">
<h1 id="%E6%A0%B7%E6%9C%AC%E5%8F%A3%E5%BE%84-%E6%A0%B7%E6%9C%AC%E5%86%85%E6%A0%B7%E6%9C%AC%E5%A4%96%E5%9C%A8%E8%BF%99%E9%87%8C%E7%A9%B6%E7%AB%9F%E6%8C%87%E4%BB%80%E4%B9%88">[样本口径] “样本内/样本外”在这里究竟指什么？</h1>
<table>
<thead>
<tr>
<th>本报告用语</th>
<th>切分方法</th>
<th>能说明什么</th>
<th>不能说明什么</th>
</tr>
</thead>
<tbody>
<tr>
<td>发布前回溯期</td>
<td>首个点位至发布日期</td>
<td>发布时对外展示的历史曲线</td>
<td>不一定等于模型训练样本</td>
</tr>
<tr>
<td>发布后运行期</td>
<td>发布日锚点至2026-08-11</td>
<td>公开发布后的指数表现</td>
<td>不等于真实产品净收益</td>
</tr>
</tbody>
</table>
<ul>
<li>正式方法书和规则版本缺失，因此不能证明真正的参数训练边界。</li>
<li>CICSF040 的基日=发布日期：它没有公开回溯曲线，但<strong>不等于研发时没有看过历史数据</strong>。</li>
<li>CI011800 的发布日期落在一次未修复回撤中；机械切分会遮住跨界回撤。</li>
</ul>
<blockquote>
<p>答辩时可说：本文沿用“样本内/样本外”主题，但计算上使用更准确的“发布前回溯/发布后运行”。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4">
<h1 id="%E6%95%B0%E6%8D%AE%E5%AE%A1%E8%AE%A1-%E4%B8%A4%E4%BB%BD-excel-%E5%90%8C%E6%BA%90%E4%BD%86%E6%97%A5%E9%A2%91%E9%A3%8E%E9%99%A9%E4%B8%8D%E8%83%BD%E6%B7%B7%E7%AE%97">[数据审计] 两份 Excel 同源，但日频风险不能混算</h1>
<table>
<thead>
<tr>
<th>检查</th>
<th style="text-align:right">结果</th>
<th>含义</th>
</tr>
</thead>
<tbody>
<tr>
<td>原始 <code>Index_Daily</code></td>
<td style="text-align:right">9,206条实际更新日记录</td>
<td>日频风险主数据</td>
</tr>
<tr>
<td>手工宽表</td>
<td style="text-align:right">4,595个统一日期</td>
<td>用于逐点对账</td>
</tr>
<tr>
<td>共同日期点位差</td>
<td style="text-align:right">最大仅0.005点</td>
<td>两表在两位小数舍入内一致</td>
</tr>
<tr>
<td>手工表额外日期</td>
<td style="text-align:right">每只多69—316天</td>
<td>含休市或该指数未更新日的重复点位</td>
</tr>
<tr>
<td>成分权重</td>
<td style="text-align:right">196条全部为空</td>
<td>不能做真实归因或复现组合</td>
</tr>
</tbody>
</table>
<ul>
<li>用手工表直接算日波动会加入大量 0 收益日，波动率被压低。</li>
<li>因此：<strong>收益首尾值两表接近，日频波动/夏普必须用实际更新日表。</strong></li>
<li>GALLW 在手工表有 2026-08-12 新值，其他三只未更新；为可比性统一截到 8 月 11 日。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5">

<p><img src="../figures/07_%E5%85%AC%E4%BC%97%E5%8F%B7%E6%8C%87%E6%A0%87%E5%A4%8D%E7%AE%97.png" alt="" /></p>
<ul>
<li>灰柱为公众号原文，计算口径未知；蓝柱统一采用实际日历 CAGR 与日频、根号252、Rf=1.5%的夏普。</li>
<li>收益存在版本/算法差：CI011800 发布前年化统一复算为 <strong>1.68%</strong>，不是 3.36%。</li>
<li>GALLW 差异最大：发布前统一夏普为 <strong>1.52</strong>，不是 3.90；发布后为 <strong>0.51</strong>，不是 1.61。</li>

</ul>
</section>

<li>战术调整：有机会适应市场，也增加参数、换手、模型和过拟合风险。</li>
<li>目前任何一只都无法从公开材料完整复现。</li>

</section>

<p><img src="../figures/06_%E5%85%B1%E5%90%8C%E5%8C%BA%E9%97%B4.png" alt="" /></p>

<h1 id="%E6%A8%A1%E5%9D%976-%E7%A8%B3%E5%AE%9A%E6%80%A7-2025-%E6%98%AF%E5%9B%9B%E5%8F%AA%E5%85%B1%E5%90%8C%E7%9A%84%E9%AB%98%E6%94%B6%E7%9B%8A%E5%B9%B4">[模块6 稳定性] 2025 是四只共同的高收益年</h1>
<p><img src="../figures/03_%E5%B9%B4%E5%BA%A6%E6%94%B6%E7%9B%8A%E7%83%AD%E5%8A%9B%E5%9B%BE.png" alt="" /></p>
<ul>
<li>CI011800：2024 <strong>+7.82%</strong> → 2025 <strong>+32.98%</strong> → 2026 YTD <strong>+13.54%</strong>。</li>
<li>2025 不只 CI011800 好：GALLW +20.19%、CICSF040 +13.91%、CI011001 +9.49%。</li>
<li>因此 CI011800 的“明星年”既含自身策略/暴露，也含共同市场顺风，不能全部归为选资产能力。</li>
<li>稳定性不能只看全期夏普；应看年度分布、滚动夏普和回撤持续时间。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14">
<h1 id="%E6%A8%A1%E5%9D%976-%E7%A8%B3%E5%AE%9A%E6%80%A7-%E5%85%A8%E6%9C%9F%E9%AB%98%E5%A4%8F%E6%99%AE%E4%BC%9A%E6%8E%A9%E7%9B%96%E6%97%B6%E5%8F%98%E6%80%A7">[模块6 稳定性] 全期高夏普会掩盖时变性</h1>
<p><img src="../figures/05_%E6%BB%9A%E5%8A%A8%E5%A4%8F%E6%99%AE.png" alt="" /></p>
<ul>
<li>CICSF040 长期滚动夏普大多为正，是四只中运行证据最稳定者。</li>
<li>CI011001 发布前后都有显著高低阶段；“样本外更好”并非每个窗口都成立。</li>
<li>GALLW 发布后滚动夏普明显下行，最新约在 1 附近。</li>
<li>CI011800 在首个完整滚动窗口为负，随后随 2025—2026 行情大幅上升。</li>
</ul>
<blockquote>
<p>一条全期夏普=2的曲线，可能由夏普0.5与3.5的多个阶段拼成。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15">
<h1 id="%E6%A8%A1%E5%9D%977-%E5%BD%92%E5%9B%A0-ci011800-%E7%9A%84-2025-3298%E5%8F%AA%E8%83%BD%E6%8F%90%E5%87%BA%E5%81%87%E8%AF%B4%E4%B8%8D%E8%83%BD%E4%B8%8B%E7%BB%93%E8%AE%BA">[模块7 归因] CI011800 的 2025 +32.98%：只能提出假说，不能下结论</h1>
<p><img src="../figures/08_CI011800%E6%88%90%E5%88%86%E5%8F%98%E5%8C%96.png" alt="" /></p>
<p>已知：</p>
<ul>
<li>成分数量由 2023Q4 的 8 只增至 2026Q2 的 32 只。</li>
<li>2025 年多个季度相邻名单 Jaccard 低于 0.30，名单更替显著。</li>
<li>最新名单横跨主题权益、海外权益、债券、商品、黄金与 REITs。</li>
</ul>
<p>未知：</p>
<ul>
<li>196 条历史成分记录的权重全部为空。</li>
<li>最新映射表与 2026Q2 名单只有 20 只重合。</li>
<li>因而不能计算资产收益贡献、风险贡献、择时贡献或真实换手率。</li>
</ul>
<blockquote>
<p>正确表述：2025 高收益与成分池扩张/更替同期发生；因缺权重，因果与贡献均待验证。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16">
<h1 id="%E6%A8%A1%E5%9D%978-%E5%B8%82%E5%9C%BA%E7%8A%B6%E6%80%81-%E5%85%88%E6%AF%94%E8%BE%83%E7%BB%93%E6%9E%9C%E5%86%8D%E8%B0%88%E5%A2%9E%E9%95%BF%E9%80%9A%E8%83%80%E6%9C%BA%E5%88%B6">[模块8 市场状态] 先比较“结果”，再谈增长/通胀机制</h1>
<p><img src="../figures/09_%E5%8E%8B%E5%8A%9B%E7%AA%97%E5%8F%A3.png" alt="" /></p>
<ul>
<li>2015、2018、2020 只有 CICSF040 与 CI011001 有可比样本。</li>
<li>2022 股债压力窗口三只有样本且均为正，但这不证明每个底层资产均有效对冲。</li>
<li>2025 四只普遍上涨，说明市场环境是解释“样本外明星”的共同变量。</li>
<li>没有历史权重时，不能把窗口收益归因为黄金、债券或择时。</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17">
<h1 id="%E6%A8%A1%E5%9D%979-%E5%8E%8B%E5%8A%9B%E6%B5%8B%E8%AF%95-%E6%9C%80%E5%A4%A7%E5%9B%9E%E6%92%A4%E8%A6%81%E7%9C%8B%E5%AE%8C%E6%95%B4%E8%B7%AF%E5%BE%84%E4%B8%8D%E8%83%BD%E5%8F%AA%E7%9C%8B%E5%88%87%E5%88%86%E7%BB%93%E6%9E%9C">[模块9 压力测试] 最大回撤要看完整路径，不能只看切分结果</h1>
<p><img src="../figures/04_%E5%9B%9E%E6%92%A4%E8%B7%AF%E5%BE%84.png" alt="" /></p>
<p>最关键发现：</p>
<ul>
<li>CI011800 发布前回撤 -9.93%，发布后回撤 -10.29%，但<strong>全历史最大回撤为 -15.32%</strong>。</li>
<li>原因：2023-11-10 发布时指数仍处于从 2023-04-17 高点开始的回撤；分段后换了净值基准。</li>
<li>GALLW 发布后的最大回撤 -7.99%尚未修复，水下已持续 194 个日历日（截至截止日）。</li>
</ul>
<blockquote>
<p>样本切分能研究发布效应，也可能机械地切断一段真实风险事件。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18">
<h1 id="%E6%A8%A1%E5%9D%9710-%E5%9F%BA%E5%87%86%E6%AF%94%E8%BE%83-%E7%8E%B0%E5%9C%A8%E8%83%BD%E5%81%9A%E5%90%8C%E7%B1%BB%E6%AF%94%E8%BE%83%E8%BF%98%E4%B8%8D%E8%83%BD%E8%AF%81%E6%98%8E%E5%A4%8D%E6%9D%82%E6%A8%A1%E5%9E%8B%E4%BC%98%E4%BA%8E%E7%AE%80%E5%8D%95%E5%9F%BA%E5%87%86">[模块10 基准比较] 现在能做“同类比较”，还不能证明复杂模型优于简单基准</h1>
<p>已完成：</p>
<ul>
<li>四指数共同区间归一化比较；</li>
<li>同一指标公式与无风险利率；</li>
<li>发布前后与压力窗口比较。</li>
</ul>
<p>仍缺：</p>
<ul>
<li>60/40、股债商等权、简单风险平价、目标波动等可投资基准；</li>
<li>与四指数资产池一致的全收益底层指数；</li>
<li>统一费用、换手和滑点后的净收益。</li>
</ul>
<blockquote>
<p>在资产池不同、收益处理方式不同的情况下，“复杂模型胜出”目前不是可证结论。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19">
<h1 id="%E6%A8%A1%E5%9D%9711-%E6%A0%B7%E6%9C%AC%E4%B8%8E%E7%A8%B3%E5%81%A5%E6%80%A7-%E5%89%8D%E5%90%8E%E5%B7%AE%E5%BC%82%E7%9A%84%E7%BB%9F%E8%AE%A1%E5%8C%BA%E9%97%B4%E6%9C%89%E5%A4%9A%E5%AE%BD">[模块11 样本与稳健性] 前后差异的统计区间有多宽？</h1>
<p><img src="../figures/10_bootstrap%E5%89%8D%E5%90%8E%E5%B7%AE%E5%BC%82.png" alt="" /></p>

<td>指数可复现性</td>
<td>四只均缺完整历史权重；GALLW规则信息最少</td>
</tr>
</tbody>
</table>
<p>CI011001 挂钩产品的存在由公开产品/公司公告支持，但收益凭证通常是结构化收益，不等于 1:1 持有指数。[来源见附录]</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25">
<h1 id="%E6%9C%80%E7%BB%88%E7%BB%93%E8%AE%BA%E4%BB%8E%E6%BC%82%E4%BA%AE%E6%9B%B2%E7%BA%BF%E8%B5%B0%E5%88%B0%E5%8F%AF%E6%8A%95%E8%B5%84%E8%AF%81%E6%8D%AE">最终结论：从“漂亮曲线”走到“可投资证据”</h1>
<ol>
<li><strong>文章主线成立</strong>：发布前回溯曲线必须与发布后运行记录分开。</li>
<li><strong>原文数字不够可靠</strong>：尤其是 GALLW 夏普与 CI011001 发布前年化。</li>
<li><strong>四只各有不同的核心问题</strong>：
<ul>
<li>CI011800：高收益，但权重缺失、跨界回撤被切分遮蔽；</li>
<li>CICSF040：长期最稳，但规则与资产仍不透明；</li>
<li>CI011001：样本外略优，但统计优势不强；</li>
<li>GALLW：出现衰减，但样本太短、原文夏普不可复现。</li>
</ul>
</li>
<li><strong>不能做的结论</strong>：没有权重时不能声称某资产贡献了收益，也不能证明复杂配置优于简单基准。</li>
<li><strong>下一步优先级</strong>：正式方法书 → 历史权重 → 规则版本 → 产品净值/费用 → 同资产池简单基准。</li>
</ol>
<blockquote>
<p>多资产指数的真正体检标准不是“曲线是否漂亮”，而是“收益能否解释、规则能否复现、产品能否兑现”。</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26">
<h1 id="%E9%99%84%E5%BD%95%E4%B8%BB%E8%A6%81%E8%B5%84%E6%96%99%E4%B8%8E%E8%AF%81%E6%8D%AE%E7%AD%89%E7%BA%A7">附录：主要资料与证据等级</h1>
<ul>
<li>Wind 两份本地工作簿：元数据、日点位、成分快照与底层映射（一级证据）。</li>
<li><a href="https://www.citicsf.com/e-futures/about/disclosure?id=734599">中信期货资产管理中心信息公示</a>：宏观因子配置 + 风险平价优化（机构官方）。</li>
<li><a href="https://www.cfachina.org/servicesupport/analygarden/jrl/gz/202207/P020220713594358294828.pdf">中信期货：基于宏观因子的风险平价研究</a>：六类宏观因子与优化框架（机构研究；不等同指数正式方法书）。</li>
<li><a href="https://pdf.dfcfw.com/pdf/H2_AN202302101582999436_1.pdf">君享大类资产全天候1号产品说明</a>：CI011001 的资产池与产品定位（产品法律文件镜像）。</li>
<li><a href="https://k.sina.cn/article_2674680361_9f6c622901901bpho.html">国泰君安全天候方法介绍</a>：风险平价、动态风险预算与组合优化（二级媒体，待正式方法书复核）。</li>
<li><a href="https://cdn.chinastock.com.cn/omc/investRelation/sh/601881_20260331_XWZA.pdf">中国银河2025年年报摘要</a>：确认落地全天候大类资产配置指数（机构官方，但未披露方法）。</li>
<li><a href="https://static.cninfo.com.cn/finalpage/2026-01-22/1224945501.PDF">CI011001挂钩收益凭证公告案例</a>：证明存在产品化案例（公司公告）。</li>
</ul>
<p>所有公开材料与指数正式编制说明之间的差距，已单列在 [[数据缺口与补数清单]]。</p>
</section>
